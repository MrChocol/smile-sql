{{define "content"}}
<div class="login-page">
  <div class="login-left">
    <div class="login-brand">
      <img src="/static/logo.jpg" alt="Smile 思迈" class="login-logo">
      <div class="login-brand-text">
        <h1 class="login-title">Smile<span class="login-title-cn">思迈</span></h1>
        <p class="login-subtitle">SQL 全生命周期管理平台</p>
      </div>
    </div>
    <div class="login-features">
      <div class="login-feature">
        <div class="login-feature-icon">📝</div>
        <div class="login-feature-text">
          <div class="login-feature-title">脚本管理</div>
          <div class="login-feature-desc">统一录入、版本化管理</div>
        </div>
      </div>
      <div class="login-feature">
        <div class="login-feature-icon">🚀</div>
        <div class="login-feature-text">
          <div class="login-feature-title">多环境推送</div>
          <div class="login-feature-desc">开发 / 测试 / 生产一键同步</div>
        </div>
      </div>
      <div class="login-feature">
        <div class="login-feature-icon">📦</div>
        <div class="login-feature-text">
          <div class="login-feature-title">Git 归档</div>
          <div class="login-feature-desc">执行记录可追溯、可回溯</div>
        </div>
      </div>
    </div>
    <div class="login-footer">
      <span>© 2026 Smile 思迈 · by powerchen</span>
    </div>
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2 class="login-card-title">欢迎回来</h2>
      <p class="login-card-sub">登录您的账号继续使用</p>

      {{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}

      <form method="POST" action="/login" class="login-form">
        <div class="login-field">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required autofocus placeholder="请输入用户名">
        </div>
        <div class="login-field">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit" class="login-btn">登 录</button>
      </form>

      <p class="login-tip">默认账号: <code>admin</code> / <code>admin123</code></p>
    </div>
  </div>
</div>

<style>
/* ===== Login Page ===== */
body { margin: 0; padding: 0; }
.login-page {
  min-height: 100vh;
  display: flex;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

/* Left side — brand */
.login-left {
  flex: 1;
  background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 60px 56px;
  position: relative;
  overflow: hidden;
}
.login-left::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -30%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(163, 230, 53, 0.12) 0%, transparent 70%);
  border-radius: 50%;
}
.login-left::after {
  content: '';
  position: absolute;
  bottom: -40%;
  left: -20%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
  border-radius: 50%;
}

.login-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 1;
}
.login-logo {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}
.login-brand-text { display: flex; flex-direction: column; gap: 2px; }
.login-title {
  font-size: 28px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.5px;
}
.login-title-cn {
  font-size: 20px;
  font-weight: 500;
  margin-left: 10px;
  color: #a3e635;
}
.login-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin: 0;
  letter-spacing: 1px;
}

/* Feature list */
.login-features {
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: relative;
  z-index: 1;
  margin-top: 40px;
}
.login-feature {
  display: flex;
  align-items: center;
  gap: 16px;
}
.login-feature-icon {
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  backdrop-filter: blur(10px);
}
.login-feature-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 2px;
}
.login-feature-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
}

.login-footer {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  position: relative;
  z-index: 1;
}

/* Right side — form */
.login-right {
  flex: 0 0 480px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.login-card {
  width: 100%;
  max-width: 360px;
}
.login-card-title {
  font-size: 26px;
  font-weight: 700;
  color: #1e293b;
  margin: 0 0 6px 0;
}
.login-card-sub {
  font-size: 14px;
  color: #64748b;
  margin: 0 0 32px 0;
}

.login-form { display: flex; flex-direction: column; gap: 18px; }
.login-field label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #475569;
  margin-bottom: 6px;
}
.login-field input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 14px;
  box-sizing: border-box;
  transition: all 0.2s;
  background: #f8fafc;
}
.login-field input:focus {
  outline: none;
  border-color: #84cc16;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(132, 204, 22, 0.1);
}

.login-btn {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 4px;
  transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(132, 204, 22, 0.3);
}
.login-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(132, 204, 22, 0.4);
}
.login-btn:active {
  transform: translateY(0);
}

.login-tip {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: #94a3b8;
}
.login-tip code {
  background: #f1f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 11px;
  color: #64748b;
}

/* Flash on login */
.flash {
  background: #fef2f2;
  color: #dc2626;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 18px;
  border: 1px solid #fecaca;
}

/* Responsive */
@media (max-width: 900px) {
  .login-left { display: none; }
  .login-right { flex: 1; }
}
</style>
{{end}}
