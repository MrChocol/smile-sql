<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smile 思迈 · SQL 管理平台</title>
  <style>
    /* ========== Reset & Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f6f8; color: #1a1a2e; font-size: 14px; line-height: 1.5; }
    a { text-decoration: none; }

    /* ========== Header ========== */
    header.topbar {
      background: #1a1a2e;
      color: #fff;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header.topbar .brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header.topbar .brand .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e94560;
      box-shadow: 0 0 8px rgba(233,69,96,0.6);
    }
    header.topbar .user-info {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #c4c4c4;
    }
    header.topbar .user-info .user-name { color: #fff; font-weight: 500; }
    header.topbar .user-info .user-role {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    header.topbar .user-info a {
      color: #8ecae6;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }
    header.topbar .user-info a:hover { color: #fff; }

    /* Mobile toggle button */
    .sidebar-toggle {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ========== Layout ========== */
    .layout { display: flex; min-height: calc(100vh - 52px); }

    /* ========== Sidebar ========== */
    nav.sidebar {
      width: 200px;
      background: #16213e;
      color: #c4c4c4;
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      transition: transform 0.3s ease;
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    /* Sidebar brand / logo area */
    .sidebar-brand {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
    }
    .sidebar-brand .sb-logo {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }
    .sidebar-brand .sb-logo img {
      display: block;
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }
    .sidebar-brand .sb-text {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    /* Menu groups */
    .menu-groups { padding: 4px 0 16px; }

    .menu-group { margin-bottom: 4px; }

    /* Single-level menu item (no submenu) */
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: #c4c4c4;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .menu-item:hover {
      background: rgba(15, 52, 96, 0.5);
      color: #fff;
      border-left-color: rgba(233, 69, 96, 0.5);
    }
    .menu-item.active {
      background: #0f3460;
      color: #fff;
      border-left-color: #e94560;
      font-weight: 500;
    }
    .menu-item .menu-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .menu-item .menu-text { flex: 1; }

    /* Group header (for expandable groups) */
    .menu-group > summary {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      color: #8892b0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .menu-group > summary::-webkit-details-marker { display: none; }
    .menu-group > summary:hover { color: #c4c4c4; }
    .menu-group > summary .menu-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      text-transform: none;
    }
    .menu-group > summary .menu-text {
      flex: 1;
      text-transform: none;
      letter-spacing: normal;
      font-size: 14px;
      font-weight: 500;
      color: #c4c4c4;
    }
    .menu-group > summary .menu-arrow {
      font-size: 10px;
      transition: transform 0.2s ease;
      color: #6b7280;
    }
    .menu-group[open] > summary .menu-arrow { transform: rotate(180deg); }

    /* Sub-items */
    .menu-subitems { padding: 2px 0 6px; }
    .menu-subitem {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px 8px 50px;
      color: #a0aec0;
      text-decoration: none;
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
      position: relative;
    }
    .menu-subitem::before {
      content: "";
      position: absolute;
      left: 34px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #4a5568;
      transition: all 0.2s ease;
    }
    .menu-subitem:hover {
      background: rgba(15, 52, 96, 0.3);
      color: #fff;
    }
    .menu-subitem:hover::before { background: #e94560; }
    .menu-subitem.active {
      background: rgba(15, 52, 96, 0.6);
      color: #fff;
      border-left-color: #e94560;
      font-weight: 500;
    }
    .menu-subitem.active::before { background: #e94560; }

    /* Section divider */
    .menu-divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin: 8px 16px;
    }

    /* ========== Main Content ========== */
    main.content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* ========== Login ========== */
    .login-wrap { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .login-wrap h2 { text-align: center; margin-bottom: 24px; color: #1a1a2e; }
    .login-wrap label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 12px; }
    .login-wrap input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    .login-wrap button { width: 100%; padding: 10px; margin-top: 20px; background: #e94560; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    .login-wrap button:hover { background: #c73e54; }

    /* ========== Flash Messages ========== */
    .flash { background: #fee; color: #c33; padding: 8px 12px; border-radius: 4px; font-size: 13px; margin-bottom: 12px; }
    .flash-success { background: #dcfce7; color: #166534; }

    /* ========== Tables ========== */
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f0f0f3; font-weight: 600; }

    /* ========== Buttons ========== */
    .btn { display: inline-block; padding: 6px 14px; background: #1a1a2e; color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; border: none; cursor: pointer; }
    .btn:hover { background: #16213e; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #d97706; }
    .btn-warning:hover { background: #b45309; }
    .btn-info { background: #2563eb; }
    .btn-info:hover { background: #1d4ed8; }
    form.inline { display: inline; }

    /* ========== Page Title ========== */
    .page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

    /* ========== Status Badges ========== */
    .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
    .badge-draft { background: #e0e7ff; color: #3730a3; }
    .badge-published { background: #dbeafe; color: #1e40af; }
    .badge-executing { background: #fef3c7; color: #b45309; }
    .badge-archived { background: #d1fae5; color: #065f46; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-failed { background: #fee2e2; color: #991b1b; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-manual { background: #e0e7ff; color: #3730a3; }
    .badge-manual_marked { background: #e0e7ff; color: #3730a3; }
    .badge-executed { background: #dcfce7; color: #166534; }

    /* ========== Workflow Stepper ========== */
    .workflow-stepper { display: flex; align-items: center; margin-bottom: 24px; background: #fff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow-x: auto; }
    .workflow-step { display: flex; align-items: center; flex-shrink: 0; }
    .workflow-step .step-num { width: 28px; height: 28px; border-radius: 50%; background: #e5e7eb; color: #6b7280; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .workflow-step.active .step-num { background: #1a1a2e; color: #fff; }
    .workflow-step.done .step-num { background: #16a34a; color: #fff; }
    .workflow-step .step-label { margin-left: 8px; font-size: 13px; color: #6b7280; white-space: nowrap; }
    .workflow-step.active .step-label { color: #1a1a2e; font-weight: 600; }
    .workflow-step.done .step-label { color: #16a34a; font-weight: 500; }
    .workflow-step .step-link { text-decoration: none; display: flex; align-items: center; }
    .workflow-step .step-link:hover .step-label { text-decoration: underline; }
    .workflow-line { flex: 1; height: 2px; background: #e5e7eb; margin: 0 8px; min-width: 20px; }
    .workflow-line.done { background: #16a34a; }

    /* ========== Password Toggle ========== */
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 60px !important; }
    .pwd-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; font-size: 12px; cursor: pointer; padding: 4px 8px; }
    .pwd-toggle:hover { color: #1a1a2e; }

    /* ========== Card ========== */
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .card h3 { font-size: 16px; margin-bottom: 12px; }

    /* ========== Dashboard Specific ========== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border-left: 4px solid #1a1a2e;
    }
    .stat-card .stat-label {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 8px;
    }
    .stat-card .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .stat-card.scripts { border-left-color: #2563eb; }
    .stat-card.releases { border-left-color: #d97706; }
    .stat-card.executions { border-left-color: #16a34a; }
    .stat-card.archives { border-left-color: #8b5cf6; }

    /* ========== Responsive ========== */
    @media (max-width: 768px) {
      nav.sidebar {
        position: fixed;
        left: 0;
        top: 52px;
        bottom: 0;
        z-index: 99;
        transform: translateX(-100%);
        box-shadow: 2px 0 8px rgba(0,0,0,0.15);
      }
      nav.sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: block; }
      main.content { padding: 16px; }
      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.4);
        z-index: 98;
      }
      .sidebar-overlay.show { display: block; }
    }
  </style>
</head>
<body>
  {{if .User}}
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="切换菜单">☰</button>
      <span class="brand">
        <span class="brand-dot"></span>
        思迈 SQL 管理平台
      </span>
    </div>
    <span class="user-info">
      <span class="user-name">{{.User.DisplayName}}</span>
      <span class="user-role">{{.User.Role}}</span>
      <a href="/logout">登出</a>
    </span>
  </header>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sb-logo"><img src="/static/logo.jpg" alt="Smile"></div>
        <div class="sb-text">思迈 · SQL</div>
      </div>
      <div class="menu-groups">
        <!-- 1. 工作台 -->
        <div class="menu-group">
          <a href="/dashboard" class="menu-item" data-path="/dashboard">
            <span class="menu-icon">🏠</span>
            <span class="menu-text">工作台</span>
          </a>
        </div>

        <div class="menu-divider"></div>

        <!-- 2. 脚本管理 -->
        <details class="menu-group" open>
          <summary>
            <span class="menu-icon">📝</span>
            <span class="menu-text">脚本管理</span>
            <span class="menu-arrow">▾</span>
          </summary>
          <div class="menu-subitems">
            <a href="/scripts" class="menu-subitem" data-path="/scripts">脚本列表</a>
            <a href="/releases" class="menu-subitem" data-path="/releases">发布编排</a>
            <a href="/executions" class="menu-subitem" data-path="/executions">执行记录</a>
          </div>
        </details>

        <!-- 3. 归档版本 -->
        <details class="menu-group" open>
          <summary>
            <span class="menu-icon">📦</span>
            <span class="menu-text">归档版本</span>
            <span class="menu-arrow">▾</span>
          </summary>
          <div class="menu-subitems">
            <a href="/archives" class="menu-subitem" data-path="/archives">归档记录</a>
            <a href="/versions" class="menu-subitem" data-path="/versions">版本管理</a>
          </div>
        </details>

        <div class="menu-divider"></div>

        <!-- 4. 系统配置 -->
        <details class="menu-group" open>
          <summary>
            <span class="menu-icon">⚙️</span>
            <span class="menu-text">系统配置</span>
            <span class="menu-arrow">▾</span>
          </summary>
          <div class="menu-subitems">
            <a href="/projects" class="menu-subitem" data-path="/projects">项目管理</a>
            <a href="/environments" class="menu-subitem" data-path="/environments">环境配置</a>
            <a href="/datasources" class="menu-subitem" data-path="/datasources">数据源</a>
            <a href="/settings/git" class="menu-subitem" data-path="/settings/git">Git 配置</a>
            <a href="/settings/clean" class="menu-subitem" data-path="/settings/clean" style="color:#f87171;">数据清理</a>
          </div>
        </details>
      </div>
    </nav>
    <main class="content">
      {{block "content" .}}{{end}}
    </main>
  </div>

  <script>
    // Highlight active menu item based on current URL path
    (function() {
      var path = window.location.pathname;
      // Normalize: remove trailing slash except for root
      if (path.length > 1 && path.endsWith('/')) {
        path = path.slice(0, -1);
      }
      var items = document.querySelectorAll('.menu-item[data-path], .menu-subitem[data-path]');
      for (var i = 0; i < items.length; i++) {
        var itemPath = items[i].getAttribute('data-path');
        // Match exact or starts with (for detail pages like /scripts/123)
        if (path === itemPath || (itemPath !== '/dashboard' && path.indexOf(itemPath) === 0)) {
          items[i].classList.add('active');
          // Also open the parent details group if it's a subitem
          var parent = items[i].closest('details.menu-group');
          if (parent) parent.setAttribute('open', '');
        }
      }
    })();

    // Mobile sidebar toggle
    function toggleSidebar() {
      var sidebar = document.getElementById('sidebar');
      var overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    }
  </script>

  {{else}}
  <main class="content">
    {{block "content" .}}{{end}}
  </main>
  {{end}}
</body>
</html>
