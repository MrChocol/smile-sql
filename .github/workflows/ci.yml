name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Build (Linux)
        env:
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/server/

      - name: Build (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/server/

      - name: Build (macOS)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -o /dev/null ./cmd/server/
